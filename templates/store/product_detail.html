{% extends 'base.html' %}{% block title %}{{ product.name }} · Northstar{% endblock %}{% block content %}<section class="detail"><img src="{{ product.image_url }}" alt="{{ product.name }}"><div><p class="eyebrow">NORTHSTAR ESSENTIAL</p><h1>{{ product.name }}</h1><p class="price">${{ product.price }}</p><p>{{ product.description }}</p><p class="muted">{{ product.stock }} available</p><form method="post" action="{% url 'add_to_cart' product.id %}">{% csrf_token %}<input type="hidden" name="next" value="{% url 'cart' %}"><button class="button">Add to cart</button></form></div></section>{% endblock %}
